<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ZAB DRESSUP</title>
    <link rel="icon" type="image/x-icon" href="./img/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Silkscreen&display=swap" rel="stylesheet">

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 28px 28px 80px 28px;
            background: #d2ebff;
            font-family: "Silkscreen", monospace;
            color: #3d3d3d;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .background {
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .desktop {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 28px;
            max-width: 1500px;
            margin: 0 auto;
        }

        .window {
            background: white;
            border: 4px solid #1291f9;
            border-radius: 5px;
        }

        .title-window {
            width: 420px;
        }

        .paint-window {
            flex: 1;
            background: #efecdc;
        }

        .title-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 8px 6px 14px;
            background: #1291f9;
            color: white;
            font-size: 24px;
        }

        .window-buttons {
            display: flex;
            gap: 7px;
        }

        .window-button {
            width: 30px;
            height: 30px;
            padding: 0;
            background: #1291f9;
            color: white;
            border: 3px solid white;
            font-size: 16px;
            
        }

        .window-button.close {
            background: #f72f2f;
        }

        .title-content {
            padding: 18px;
        }

        .titulo {
            width: 100%;
            height: auto;
            display: block;
        }

        .menu-bar {
            display: flex;
            gap: 26px;
            padding: 6px 16px;
            background: #c1b891;
            color: white;
            font-size: 20px;
        }

        .paint-content {
            display: flex;
            align-items: flex-start;
            gap: 18px;
            padding: 16px;
        }

        .categories {
            width: 210px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .category-button {
            width: 100%;
            padding: 11px 6px;
            background: #efecdc;
            color: #3d3d3d;
            border: 4px solid #c1b891;
            font-size: 19px;
        }

        .category-button:hover {
            background: #e0dac0;
        }

        .category-button.active {
            background: #c1b891;
            color: white;
        }

        .body-colors {
            display: flex;
            gap: 10px;
            margin-top: 6px;
        }

        .color-button {
            flex: 1;
            height: 52px;
            border: 4px solid transparent;
        }

        .color-button:hover {
            transform: scale(1.06);
        }

        .color-button.selected {
            border: 4px solid #c1b891;
        }

        .green {
            background: #a3ff4a;
        }

        .red {
            background: #ff3131;
        }

        .gray {
            background: #bab3a2;
        }

        .items {
            width: 120px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .arrow-button {
            width: 100%;
            padding: 2px 0 6px 0;
            background: transparent;
            color: #c1b891;
            border: none;
            font-size: 22px;
        }

        .arrow-button:hover {
            transform: scale(1.1);
        }

        .arrow-up {
            transform: rotate(180deg);
        }

        .arrow-up:hover {
            transform: rotate(180deg) scale(1.1);
        }

        .options {
            width: 100%;
            height: 388px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            scroll-behavior: smooth;
        }

        .option-button {
            flex-shrink: 0;
            width: 91px;
            height: 91px;
            padding: 4px;
            background: white;
            border: 4px solid #c1b891;
            
        }

        .option-button:hover {
            transform: scale(1.06);
        }

        .option-button.selected {
            border: 4px solid #c1b891;
            background: #e0dac0;
        }

        .option-button img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .character-area {
            flex: 1;
        }

        .character-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            aspect-ratio: 600 / 650;
            background: white;
            border: 4px solid #c1b891;
            overflow: hidden;
        }

        .character-container img {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        #character { z-index: 1; }
        #pantalones { z-index: 2; }
        #cami { z-index: 3; }
        #Cara { z-index: 4; }
        #Zapatillas { z-index: 5; }
        #comp { z-index: 6; }
        #compiz { z-index: 7; }
        #collar { z-index: 8; }

        .character-container img[src=""] {
            visibility: hidden;
        }

        .taskbar {
            position: fixed;
            left: 0;
            bottom: 0;
            width: 100%;
            height: 44px;
            display: flex;
            justify-content: space-between;
            background: #1291f9;
        }

        .taskbar-start {
            width: 10%;
            min-width: 90px;
            background: #a3ff4a;
        }

        .taskbar-clock {
            width: 10%;
            min-width: 90px;
            background: #66c1ff;
        }

        @media (max-width: 1180px) {

            .desktop {
                flex-direction: column;
                align-items: center;
            }

            .title-window {
                width: 100%;
                max-width: 640px;
            }

            .paint-window {
                flex: none;
                width: 100%;
                max-width: 900px;
            }
        }

        @media (max-width: 760px) {

            body {
                padding: 14px 10px 70px 10px;
            }

            .paint-content {
                flex-direction: column;
                align-items: center;
            }

            .categories {
                width: 100%;
            }

            .items {
                width: 100%;
            }

            .arrow-button {
                display: none;
            }

            .options {
                height: auto;
                overflow: visible;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
            }

            .character-area {
                width: 100%;
            }

            .menu-bar {
                flex-wrap: wrap;
                gap: 12px;
                font-size: 16px;
            }
        }

    </style>

</head>

<body>

    <svg class="background" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
        <rect width="1600" height="900" fill="#d2ebff"/>
        <g fill="white">
            <ellipse cx="260" cy="150" rx="110" ry="34"/>
            <ellipse cx="330" cy="125" rx="70" ry="30"/>
            <ellipse cx="200" cy="130" rx="60" ry="26"/>
            <ellipse cx="1200" cy="230" rx="130" ry="38"/>
            <ellipse cx="1280" cy="200" rx="80" ry="32"/>
            <ellipse cx="1130" cy="205" rx="70" ry="28"/>
            <ellipse cx="760" cy="90" rx="90" ry="26"/>
            <ellipse cx="820" cy="72" rx="55" ry="22"/>
        </g>
        <path d="M0 600 Q 400 470 800 550 T 1600 510 V900 H0 Z" fill="#8fe04a"/>
        <path d="M0 760 Q 500 650 1000 725 T 1600 700 V900 H0 Z" fill="#6fcf3c"/>
    </svg>

    <div class="desktop">

        <div class="window title-window">

            <div class="title-bar">
                <span>Zab.exe</span>
                <div class="window-buttons">
                    <button class="window-button">_</button>
                    <button class="window-button">□</button>
                    <button class="window-button close">X</button>
                </div>
            </div>

            <div class="title-content">
                <img class="titulo" src="./img/titulo.svg" alt="ZAB DRESSUP">
            </div>

        </div>

        <div class="window paint-window">

            <div class="title-bar">
                <span>:3 - Paint</span>
                <div class="window-buttons">
                    <button class="window-button">_</button>
                    <button class="window-button">□</button>
                    <button class="window-button close">X</button>
                </div>
            </div>

            <div class="menu-bar">
                <span>File</span>
                <span>Edit</span>
                <span>View</span>
                <span>Image</span>
                <span>Colors</span>
                <span>Help</span>
            </div>

            <div class="paint-content">

                <div class="categories">

                    <button class="category-button" id="Cara-button" onclick="showOptions('Cara')">Cara</button>
                    <button class="category-button" id="cami-button" onclick="showOptions('cami')">Camiseta</button>
                    <button class="category-button" id="pantalones-button" onclick="showOptions('pantalones')">Pantalones</button>
                    <button class="category-button" id="Zapatillas-button" onclick="showOptions('Zapatillas')">Zapatillas</button>
                    <button class="category-button" id="comp-button" onclick="showOptions('comp')">Complementos 1</button>
                    <button class="category-button" id="compiz-button" onclick="showOptions('compiz')">Complementos 2</button>
                    <button class="category-button" id="collar-button" onclick="showOptions('collar')">Collares</button>

                    <div class="body-colors">
                        <button class="color-button green selected" id="color0" onclick="changeBody(0)"></button>
                        <button class="color-button red" id="color1" onclick="changeBody(1)"></button>
                        <button class="color-button gray" id="color2" onclick="changeBody(2)"></button>
                    </div>

                </div>

                <div class="items">
                    <button class="arrow-button arrow-up" onclick="scrollOptions(-1)">V</button>
                    <div class="options" id="options"></div>
                    <button class="arrow-button" onclick="scrollOptions(1)">V</button>
                </div>

                <div class="character-area">
                    <div class="character-container">
                        <img id="character" src="./img/body.png">
                        <img id="pantalones" src="">
                        <img id="cami" src="">
                        <img id="Cara" src="">
                        <img id="Zapatillas" src="">
                        <img id="comp" src="">
                        <img id="compiz" src="">
                        <img id="collar" src="">
                    </div>
                </div>

            </div>

        </div>

    </div>

    <div class="taskbar">
        <div class="taskbar-start"></div>
        <div class="taskbar-clock"></div>
    </div>

    <script>

        var clothing = {

            character: [
                "./img/body.png",
                "./img/body2.png",
                "./img/body3.png"
            ],

            Cara: [
                "./img/ojos1.png",
                "./img/ojos2.png",
                "./img/ojos3.png",
                "./img/ojos4.png",
                "./img/ojos5.png",
                "./img/ojos6.png"
            ],

            cami: [
                "./img/cami1.png",
                "./img/cami2.png",
                "./img/cami3.png"
            ],

            pantalones: [
                "./img/pant1.png",
                "./img/pant2.png",
                "./img/pant3.png"
            ],

            Zapatillas: [
                "./img/zap1.png",
                "./img/zap2.png",
                "./img/zap3.png"
            ],

            comp: [
                "./img/comp1.png",
                "./img/comp2.png",
                "./img/comp3.png",
                "./img/comp4.png",
                "./img/comp5.png",
                "./img/comp6.png"
            ],

            compiz: [
                "./img/comp1_iz.png",
                "./img/comp2_iz.png",
                "./img/comp3_iz.png",
                "./img/comp4_iz.png",
                "./img/comp5_iz.png",
                "./img/com6_iz.png"
            ],

            collar: [
                "./img/coll1.png",
                "./img/coll2.png",
                "./img/coll3.png"
            ]
        };

        var selectedItems = {};

        var rowHeight = 99;

        function showOptions(category) {

            var categoryButtons = document.querySelectorAll(".category-button");

            for (var i = 0; i < categoryButtons.length; i++) {
                categoryButtons[i].classList.remove("active");
            }

            document.getElementById(category + "-button").classList.add("active");

            var options = document.getElementById("options");

            options.innerHTML = "";
            options.scrollTop = 0;

            for (var j = 0; j < clothing[category].length; j++) {
                options.appendChild(createOptionButton(category, clothing[category][j]));
            }
        }

        function createOptionButton(category, imagePath) {

            var button = document.createElement("button");
            button.className = "option-button";

            var img = document.createElement("img");
            img.src = imagePath;
            button.appendChild(img);

            if (selectedItems[category] == imagePath) {
                button.classList.add("selected");
            }

            button.onclick = function () {

                changeClothing(category, imagePath);

                var allButtons = document.querySelectorAll(".option-button");

                for (var i = 0; i < allButtons.length; i++) {
                    allButtons[i].classList.remove("selected");
                }

                button.classList.add("selected");
            };

            return button;
        }

        function scrollOptions(direction) {

            var options = document.getElementById("options");

            options.scrollTop = options.scrollTop + direction * rowHeight;
        }

        function changeBody(number) {

            for (var i = 0; i < 3; i++) {
                document.getElementById("color" + i).classList.remove("selected");
            }

            document.getElementById("color" + number).classList.add("selected");

            changeClothing("character", clothing.character[number]);
        }

        function changeClothing(category, image) {

            selectedItems[category] = image;

            document.getElementById(category).src = image;

            if (category == "character") {
                cambiarPantalon();
                cambiarCara();
            }

            if (category == "pantalones") {
                cambiarPantalon();
            }

            if (category == "Cara") {
                cambiarCara();
            }
        }

        function cambiarPantalon() {

            var cuerpo = document.getElementById("character");
            var pantalon = document.getElementById("pantalones");

            if (!selectedItems.pantalones) {
                return;
            }

            var pantalonActual = selectedItems.pantalones;

            if (pantalonActual.includes("pant1.png")) {

                if (cuerpo.src.includes("body2.png")) {
                    pantalon.src = "./img/pant1_body2_1.svg";
                }
                else if (cuerpo.src.includes("body3.png")) {
                    pantalon.src = "./img/pant1_body2.svg";
                }
                else {
                    pantalon.src = "./img/pant1.png";
                }
            }
            else {
                pantalon.src = pantalonActual;
            }
        }

        function cambiarCara() {

            var cuerpo = document.getElementById("character");
            var cara = document.getElementById("Cara");

            if (!selectedItems.Cara) {
                return;
            }

            var caraActual = selectedItems.Cara;

            if (caraActual.includes("ojos3.png")) {

                if (cuerpo.src.includes("body2.png")) {
                    cara.src = "./img/ojos3_body2.svg";
                }
                else if (cuerpo.src.includes("body3.png")) {
                    cara.src = "./img/ojos3_body3.svg";
                }
                else {
                    cara.src = "./img/ojos3.png";
                }
            }
            else {
                cara.src = caraActual;
            }
        }

        selectedItems.character = clothing.character[0];
        showOptions("Cara");

    </script>

</body>

</html>
